version: "3.8"

services:
  # 1. PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: booking_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Express Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: booking_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:admin123@postgres:5432/postgres
      JWT_SECRET: super_secret_booking_rooms_jwt_key_2026
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React Frontend UI Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: booking_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

# Persistent storage volume for PostgreSQL data
volumes:
  pgdata: